<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Gamer – Usher Positions</title><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style id="app-css">
:root{--bg:#000;--line:#262626;--line2:#1a1a1a;--text:#e8e8e8;--muted:#7a7a7a;--dot:#b8901c;--dot-hi:#f0c94a;--topH:0px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.top{background:var(--bg);z-index:20;padding-bottom:10px;border-bottom:1px solid var(--line)}
@media (min-height:720px) and (min-width:700px){.top{position:sticky;top:0}}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:14px 20px 12px}
h1{font-size:13px;margin:0;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.subtitle{color:var(--muted);font-size:12px}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.pill{font-size:12px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text);font-weight:500}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:12px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:0;padding:4px 10px;cursor:pointer}
button:hover{border-color:#555}
button.primary{border-color:var(--text)}
button.primary:not(:disabled):hover{background:var(--text);color:#000}
button.primary:disabled{opacity:.3;cursor:default}
.seg{display:flex;border:1px solid var(--line)}
.seg button{border:0;padding:4px 9px;color:var(--muted)}
.seg button.on{color:var(--text);text-decoration:underline;text-underline-offset:4px}
.zoomlbl{font-size:12px;color:var(--muted);min-width:40px;text-align:center;align-self:center}
.status{font-size:12px;color:var(--muted);padding:0 6px}
.status.warn{color:var(--dot-hi)}
.map-wrap{overflow:auto;margin:0 20px;border:1px solid var(--line);background:#000}
.map-inner{position:relative;width:100%;user-select:none;-webkit-user-select:none}
.map-inner img{display:block;width:100%;height:auto;pointer-events:none}
.dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--dot);border:2px solid #000;color:#000;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;z-index:2}
.dot.named{border-color:#fff}
.dot.sel{outline:2px solid #fff;outline-offset:2px;z-index:5}
.dot.dim{opacity:.15}
.dot.dragging{cursor:grabbing;z-index:6}
.dot .lbl{position:absolute;top:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:500;color:#fff;background:#000;padding:0 4px;pointer-events:none;display:none}
.show-labels .dot .lbl{display:block}
.tip{position:absolute;z-index:10;pointer-events:none;background:#000;border:1px solid #444;padding:5px 8px;font-size:11px;white-space:nowrap;transform:translate(-50%,calc(-100% - 16px));display:none}
.tip .t1{color:var(--muted)}
.tip .t2{font-weight:700}
.hint{margin:8px 20px 0;color:var(--muted);font-size:11px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:20px 20px 0;border:1px solid var(--line);align-items:start}
@media(max-width:1050px){.board{grid-template-columns:1fr}}
.sec{border-right:1px solid var(--line)}
.sec:last-child{border-right:0}
@media(max-width:1050px){.sec{border-right:0;border-bottom:1px solid var(--line)}.sec:last-child{border-bottom:0}}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sec-h h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.count{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.leader{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--muted);flex:1 1 150px;min-width:0;text-transform:lowercase}
input,textarea{font:inherit;font-size:12px;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:4px 2px;width:100%;min-width:0}
input:hover,textarea:hover{border-bottom-color:var(--line)}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--text)}
input::placeholder,textarea::placeholder{color:#444}
input[readonly],textarea[readonly]{opacity:.8}
.subsec{padding:12px 14px;border-bottom:1px solid var(--line2)}
.subsec:last-child{border-bottom:0}
.sub-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sub-h .tag{font-weight:700;font-size:12px;white-space:nowrap}
.sub-h .count{margin-left:0}
.row{display:grid;grid-template-columns:24px 11px minmax(0,1fr) minmax(0,1fr) 22px 22px;gap:10px;align-items:center;padding:1px 0;scroll-margin-top:calc(var(--topH) + 12px)}
.row.sel .num{color:var(--dot-hi)}
.row.sel input{border-bottom-color:#555}
.num{font-size:11px;color:var(--muted);cursor:pointer;text-align:right}
.num:hover{color:var(--text)}
.swap{padding:0;width:22px;height:22px;border:0;color:#444;font-size:13px}
.swap:hover{color:var(--text)}
.sw-box{width:min(520px,100%)}
.sw-head{font-size:12px;color:var(--muted);margin:0 0 8px}
.sw-head b{color:var(--text);font-weight:700}
.sw-in{border:1px solid var(--line);padding:6px 8px;margin-bottom:8px}
.sw-list{max-height:55vh;overflow:auto;border-top:1px solid var(--line2)}
.sw-item{display:grid;grid-template-columns:32px 11px minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12px}
.sw-item:hover,.sw-item.on{background:#141414}
.sw-item .n{color:var(--muted);text-align:right}
.sw-item .w{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-item .e{color:#444;font-style:italic}
.sw-sw{width:9px;height:9px;border-radius:50%;background:var(--c-usher,#b8901c)}
.sw-sw.r-runner{background:var(--c-runner,#2f7fd8)}
.u-JU{color:var(--u-JU,#4cc274)!important}
.u-HTU{color:var(--u-HTU,#ff9440)!important}
.legend .sep{color:#333}
.search{width:190px;border:1px solid var(--line);padding:4px 8px;font-size:12px}
.search:focus{border-color:var(--text)}
.scount{font-size:11px;color:var(--muted);min-width:54px}
.row.hit{background:#18160b}
.leader.hit input{border-bottom-color:#f0c94a}
.searching .row:not(.hit){opacity:.28}
.dot.ping{animation:ping .9s ease-out 3}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.95)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.del{padding:0;width:22px;height:22px;border:0;color:#444;font-size:14px}
.del:hover{color:var(--text)}
.del.arm{color:#ff6b6b;font-size:10px;width:auto}
.add{margin-top:8px;font-size:11px;padding:2px 0;border:0;color:var(--muted)}
.add:hover{color:var(--text)}
.notes{margin:20px 20px 40px;border:1px solid var(--line);padding:12px 14px}
.notes h3{margin:0 0 6px;font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.notes textarea{min-height:84px;resize:vertical;border-bottom:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;border:1px solid #555;padding:6px 12px;font-size:12px;z-index:50;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#000;border:1px solid #444;padding:14px;width:min(560px,100%)}
.modal textarea{min-height:300px;border:1px solid var(--line);padding:8px}
.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.dot{background:var(--c-usher,#b8901c);color:var(--t-usher,#000)}
.dot.r-runner{background:var(--c-runner,#2f7fd8);color:var(--t-runner,#fff)}
.dot.r-leader{background:var(--c-leader,#2f9e55);color:var(--t-leader,#fff);border-radius:4px;width:22px;height:22px;margin:-11px 0 0 -11px;font-size:10px}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);padding-right:6px}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.legend input[type=color]{-webkit-appearance:none;appearance:none;width:14px;height:14px;padding:0;border:1px solid #555;border-radius:50%;background:none;cursor:pointer;flex:none}
.legend input[type=color].sq{border-radius:3px}
.legend input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.legend input[type=color]::-webkit-color-swatch{border:0;border-radius:inherit}
.legend input[type=color]::-moz-color-swatch{border:0;border-radius:inherit}
.role{width:11px;height:11px;border-radius:50%;padding:0;border:0;background:var(--c-usher,#b8901c);cursor:pointer}
.role.r-runner{background:var(--c-runner,#2f7fd8)}
.role:hover{outline:1px solid #fff;outline-offset:2px}
.lsw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c-leader,#2f9e55);flex:none;align-self:center}
.leader.sel input{border-bottom-color:#fff}

var leaderMap={};
function leaderItems(){
  var out=[];
  state.sections.forEach(function(s){
    out.push({key:'L-'+s.id,obj:s,sec:s,title:'Section '+s.id});
    s.subs.forEach(function(sb){out.push({key:'L-'+sb.id,obj:sb,sec:s,title:sb.title})});

function leaderPos(it){

    if(!h){h=(it.sec.subs[0]&&it.sec.subs[0].home)||{x:.5,y:.5};dy=-0.07}
    it.obj.lpos={x:Math.round(clamp(h.x-0.045)*1e4)/1e4,y:Math.round(clamp(h.y+dy)*1e4)/1e4};
  }

  if(isLeaderKey(k)){var it=leaderMap[k];return !!it&&((String(it.obj.leader||'')+' lead '+it.title).toLowerCase().indexOf(searchQ)>=0)}
  var u=uById(k);if(!u)return false;var sb=subById(u.sub);
  return ((u.name||'')+' '+(u.pos||'')+' '+(sb?sb.title:'')).toLowerCase().indexOf(searchQ)>=0;

/* ---------- map dots ---------- */
var dotEls={};
function renderDots(){
  Object.keys(dotEls).forEach(function(k){dotEls[k].remove()});dotEls={};
  var nums=numbers();
  ordered().forEach(function(u){
    var s=secOfSub(u.sub);
    var d=el('div',{class:'dot'+(u.role==='runner'?' r-runner':''),'data-id':u.id,'data-sec':s?s.id:''},[String(nums[u.id]),el('span',{class:'lbl'})]);
    placeDot(d,u);updateDotText(d,u);
    wireDot(d,u,u.id);
    inner.appendChild(d);dotEls[u.id]=d;
  });
  leaderItems().forEach(function(it){
    if(!filled(it.obj.leader))return;
    var p=leaderPos(it);
    var d=el('div',{class:'dot r-leader named','data-id':it.key,'data-sec':it.sec.id,title:''},['L',el('span',{class:'lbl',text:it.obj.leader})]);
    placeDot(d,p);
    wireDot(d,p,it.key);
    inner.appendChild(d);dotEls[it.key]=d;
  });
  applyView();
  if(selected&&dotEls[selected])dotEls[selected].classList.add('sel');
}
function wireDot(d,pos,key){
  d.addEventListener('pointerdown',function(e){startDrag(e,pos,d,key)});
  d.addEventListener('mouseenter',function(){showTip(key)});
  d.addEventListener('mouseleave',function(){if(!d.classList.contains('dragging'))hideTip()});
}
function placeDot(d,p){d.style.left=(p.x*100)+'%';d.style.top=(p.y*100)+'%'}
function updateDotText(d,u){
  d.querySelector('.lbl').textContent=u.name||u.pos||'—';
  d.querySelector('.lbl').className='lbl '+(filled(u.name)?uniCls(u.name):'');
  d.classList.toggle('named',filled(u.name));
}
function tipInfo(key){
  if(isLeaderKey(key)){var it=leaderMap[key];if(!it||!it.obj.lpos)return null;return {p:it.obj.lpos,t1:'Leader · '+it.title,t2:it.obj.leader}}
  var u=uById(key);if(!u)return null;var sb=subById(u.sub);
  return {p:u,t1:'#'+numbers()[u.id]+' · '+(sb?sb.title:'')+' · '+(u.pos||'Position')+(u.role==='runner'?' · runner':''),t2:filled(u.name)?u.name:'Unassigned',cls:uniCls(u.name)};
}
function showTip(key){var i=tipInfo(key);if(!i){hideTip();return}tip.innerHTML='';tip.appendChild(el('div',{class:'t1',text:i.t1}));tip.appendChild(el('div',{class:'t2 '+(i.cls||''),text:i.t2}));tip.style.left=(i.p.x*100)+'%';tip.style.top=(i.p.y*100)+'%';tip.style.display='block'}
function hideTip(){tip.style.display='none'}

function startDrag(e,pos,d,key){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  var sx=e.clientX,sy=e.clientY,moved=false;
  try{d.setPointerCapture(e.pointerId)}catch(_){}
  function mv(ev){
    if(!moved&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<4)return;
    if(readOnly)return;
    moved=true;d.classList.add('dragging');
    var r=inner.getBoundingClientRect();
    pos.x=clamp((ev.clientX-r.left)/r.width);pos.y=clamp((ev.clientY-r.top)/r.height);
    placeDot(d,pos);showTip(key);
  }
  function up(){
    d.removeEventListener('pointermove',mv);d.removeEventListener('pointerup',up);d.removeEventListener('pointercancel',up);
    d.classList.remove('dragging');
    if(!d.matches(':hover'))hideTip();
    pos.x=Math.round(pos.x*1e4)/1e4;pos.y=Math.round(pos.y*1e4)/1e4;
    if(moved){markDirty();select(key,{quiet:true})}else select(key,{fromMap:true});
  }
  d.addEventListener('pointermove',mv);d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
}

function refreshUsher(u){var d=dotEls[u.id];if(d)updateDotText(d,u);updateCounts()}

/* ---------- saving ---------- */
function markDirty(){if(readOnly)return;dirty=true;sSet(DRAFT_KEY,{base:BASE,state:state});updateStatus()}
function deletedSinceSave(){return (SAVED.ushers||[]).filter(function(s){return !uById(s.id)})}
function restoreDeleted(){
  var gone=deletedSinceSave();if(!gone.length)return;
  gone.forEach(function(g){
    var idx=SAVED.ushers.indexOf(g),at=0;
    for(var i=idx-1;i>=0;i--){var prev=uById(SAVED.ushers[i].id);if(prev){at=state.ushers.indexOf(prev)+1;break}}
    state.ushers.splice(at,0,JSON.parse(JSON.stringify(g)));
  });
  markDirty();renderAll();
  toast('Restored: '+gone.map(function(g){var sb=subById(g.sub);return (sb?sb.title:g.sub)+' · '+(g.pos||'')+(g.name?' ('+g.name+')':'')}).join(', '));
}
function updateStatus(){
  statusEl.classList.remove('warn');

  if(saving)txt='Saving…';
  else if(readOnly)txt=(apiState==='none'?'Snapshot · '+String(state.savedAt||'').slice(0,10):'View only');
  else if(apiState==='pending')txt=dirty?'Unsaved changes':'Loading…';
  else if(apiState==='none'){txt=dirty?'Edits kept in this browser only':'Saving unavailable here';statusEl.classList.add('warn')}
  else if(dirty){txt='Unsaved changes';statusEl.classList.add('warn')}
  else txt='All changes saved';
  statusEl.textContent=txt;
  saveBtn.disabled=!(api&&!readOnly&&dirty&&!saving);
  saveBtn.style.display=readOnly?'none':'';
  var gone=deletedSinceSave();
  restoreBtn.style.display=(gone.length&&!readOnly)?'':'none';
  restoreBtn.textContent='Restore '+gone.length+' deleted';
}
function buildDoc(st){
  var json=JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en"><head>'+HEAD+'<style id="app-css">'+CSS+'<\/style><\/head><body><script type="text/plain" id="map-data">'+MAP+'<\/script><script type="application/json" id="state">'+json+'<\/script><script id="app-js">'+JS+'<\/script><\/body><\/html>';
}
function save(){
  if(!api||saving||readOnly||!dirty)return;
  saving=true;updateStatus();
  var st=JSON.parse(JSON.stringify(state));st.savedAt=new Date().toISOString();
  sSet(VIEW_KEY,{zoom:zoom,labels:showLabels,focus:focusSec,scroll:wrap.scrollLeft},'session');
  Promise.resolve().then(function(){return api.publish(buildDoc(st))}).then(function(){
    sDel(DRAFT_KEY);dirty=false;saving=false;updateStatus();toast('Saved');
  }).catch(function(err){
    saving=false;
    var code=String((err&&(err.code||err.message||err.name))||err);
    if(/not_granted|not_writer/i.test(code)){readOnly=true;renderAll();toast('You can view this page but not save to it.')}
    else if(/conflict/i.test(code)){toast('Someone saved a newer version — loading it.')}
    else toast('Save failed: '+code);
    updateStatus();
  });
}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();save()}});

/* ---------- roster ---------- */
function rosterText(){
  var nums=numbers(),out=['POCKET GAMER – USHER POSITIONS','Abdali Boulevard',''];
  state.sections.forEach(function(s){
    var c=0;s.subs.forEach(function(sb){c+=ushersOf(sb.id).length});
    out.push((s.title?s.title.toUpperCase():'SECTION '+s.id)+' — Leader: '+(s.leader||'—')+' — '+c+' staff');
    s.subs.forEach(function(sb){
      var us=ushersOf(sb.id);
      out.push('  '+sb.title+' — Leader: '+(sb.leader||'—')+' ('+us.length+')');
      us.forEach(function(u){out.push('    '+nums[u.id]+'. '+(u.pos||'Position')+(u.role==='runner'?' [runner]':'')+' — '+(filled(u.name)?u.name.trim():'unassigned'))});
    });
    out.push('');
  });
  var run=state.ushers.filter(function(u){return u.role==='runner'}).length;
  out.push('TOTAL: '+state.ushers.length+' ('+(state.ushers.length-run)+' ushers, '+run+' runners)');
  if(filled(state.notes)){out.push('');out.push('NOTES');out.push(state.notes.trim())}
  return out.join('\n');
}
function copyRoster(){
  var t=rosterText();
  try{navigator.clipboard.writeText(t).then(function(){toast('Roster copied')},function(){showModal(t)})}catch(e){showModal(t)}
}
function showModal(t){modalTa.value=t;modal.style.display='flex';modalTa.focus();modalTa.select()}
var toastT=null;
function toast(m){toastEl.textContent=m;toastEl.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){toastEl.style.display='none'},2200)}

/* ---------- swap ---------- */
var swapFrom=null,swapIdx=0,swapItems=[];
var swapIn=el('input',{class:'sw-in',placeholder:'search name, position or section…'});
var swapHead=el('div',{class:'sw-head'});
var swapList=el('div',{class:'sw-list'});
var swapModal=el('div',{class:'modal',onclick:function(e){if(e.target===swapModal)closeSwap()}},[el('div',{class:'box sw-box'},[swapHead,swapIn,swapList,el('div',{class:'act'},[el('button',{text:'Cancel',onclick:function(){closeSwap()}})])])]);
document.body.appendChild(swapModal);
function openSwap(u){
  swapFrom=u;swapIn.value='';swapIdx=0;
  var nums=numbers(),sb=subById(u.sub);
  swapHead.innerHTML='';
  swapHead.appendChild(document.createTextNode('swap #'+nums[u.id]+' '));
  swapHead.appendChild(el('b',{class:uniCls(u.name)||null,text:filled(u.name)?u.name:'(empty)'}));
  swapHead.appendChild(document.createTextNode(' · '+(sb?sb.title:'')+' · '+(u.pos||'')+'  with…'));
  renderSwapList();swapModal.style.display='flex';swapIn.focus();
}
function closeSwap(){swapModal.style.display='none';swapFrom=null}
function renderSwapList(){
  var q=swapIn.value.trim().toLowerCase(),nums=numbers();
  swapItems=ordered().filter(function(o){
    if(o===swapFrom)return false;
    if(!q)return true;
    var sb=subById(o.sub);
    return ((o.name||'')+' '+(o.pos||'')+' '+(sb?sb.title:'')+' #'+nums[o.id]).toLowerCase().indexOf(q)>=0;
  });
  if(swapIdx>=swapItems.length)swapIdx=Math.max(0,swapItems.length-1);
  swapList.innerHTML='';
  swapItems.forEach(function(o,i){
    var sb=subById(o.sub);
    var it=el('div',{class:'sw-item'+(i===swapIdx?' on':'')},[
      el('span',{class:'n',text:'#'+nums[o.id]}),
      el('span',{class:'sw-sw'+(o.role==='runner'?' r-runner':'')}),
      el('span',{class:filled(o.name)?uniCls(o.name):'e',text:filled(o.name)?o.name:'empty'}),
      el('span',{class:'w',text:(sb?sb.title:'')+' · '+(o.pos||'')})
    ]);
    it.addEventListener('click',function(){doSwap(o)});
    swapList.appendChild(it);
  });
  if(!swapItems.length)swapList.appendChild(el('div',{class:'sw-head',style:'padding:10px 4px',text:'no match'}));
}
function doSwap(o){
  var a=swapFrom;if(!a||!o)return;
  var an=a.name,bn=o.name;a.name=bn;o.name=an;
  closeSwap();markDirty();renderAll();select(a.id,{quiet:true});
  toast((filled(an)?an:'empty')+'  ⇄  '+(filled(bn)?bn:'empty'));
}
swapIn.addEventListener('input',function(){swapIdx=0;renderSwapList()});
swapIn.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'){e.preventDefault();swapIdx=Math.min(swapItems.length-1,swapIdx+1);renderSwapList();var on=swapList.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'})}
  else if(e.key==='ArrowUp'){e.preventDefault();swapIdx=Math.max(0,swapIdx-1);renderSwapList();var on2=swapList.querySelector('.on');if(on2)on2.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();if(swapItems[swapIdx])doSwap(swapItems[swapIdx])}
  else if(e.key==='Escape'){closeSwap()}
});

/* ---------- boot ---------- */
applyColors();renderAll();updateStatus();
if(view&&view.scroll){requestAnimationFrame(function(){wrap.scrollLeft=view.scroll})}
var useFn=window.claude&&typeof window.claude.use==='function'?window.claude.use.bind(window.claude):null;
if(useFn){
  Promise.resolve(useFn('artifact')).then(function(a){api=a||null;apiState=a?'ok':'none';updateStatus()},function(){apiState='none';updateStatus()});
}else{apiState='none';readOnly=true;notesTa.readOnly=true;renderAll();updateStatus()}
})();
</script></body></html>
